name: Mini-ETL Sürekli Entegrasyon (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Testleri Çalıştır
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu Klonla
        uses: actions/checkout@v4

      - name: ⚡ uv (Paket Yöneticisi) Kurulumu
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: 🐍 Python 3.12 Kurulumu
        run: uv python install 3.12

      - name: 📦 Bağımlılıkları Yükle
        run: uv sync

      - name: 🧪 Testleri ve Kapsamı (Coverage) Çalıştır
        run: uv run pytest --cov